# 3D-MedDiffusion PatchVolume AE — BraTS-GLI 2023 c=4 baseline (T1n modality).
# See PatchVolume_4x_ukb.yaml for the canonical comments. Only the
# default_root_dir and root_dir differ here.

model:
  seed: 1234
  batch_size: 16
  num_workers: 8

  gpus: 8
  default_root_dir: /data/wonyoungjang/decodata/3d_meddiff/brats_c4
  resume_from_checkpoint:
  max_steps: 300000   # compute-matched to MAISI/DeCo-VAE stage1+stage2 (see UKB yaml)
  max_epochs: 10000
  precision: bf16

  perceptual_3d: False
  embedding_dim: 8
  n_codes: 8192
  n_hiddens: 48
  lr: 3e-4
  downsample: [4, 4, 4]
  disc_channels: 32
  disc_layers: 3
  discriminator_iter_start: 12000
  disc_loss_type: hinge
  volume_gan_weight: 2
  l1_weight: 4.0
  gan_feat_weight: 4
  perceptual_weight: 2
  i3d_feat: False
  restart_thres: 1.0
  no_random_restart: False
  norm_type: group
  num_groups: 24
  stage: 1

dataset:
  root_dir: /data/wonyoungjang/decovae/configs/3d_meddiff/data_brats.json
  image_channels: 1
  imgtype: MR
  patch_size: 64
