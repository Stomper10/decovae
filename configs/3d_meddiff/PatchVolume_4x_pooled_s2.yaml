# 3D-MedDiffusion PatchVolume AE — POOLED stage2 (VOLUME phase).
#
# 3D-MedDiff's OWN two-phase AE recipe: stage1 trains on 64^3 patches
# (PatchVolume_4x_pooled.yaml), stage2 fine-tunes on whole volumes with the
# discriminator on from step 0. This mirrors the upstream config/PatchVolume_4x_s2.yaml
# verbatim except paths + max_steps. Run with the STAGE2 entry point:
#
#   conda activate 3d_meddiff
#   python external/3d_meddiff/train/train_PatchVolume_stage2.py \
#     --config configs/3d_meddiff/PatchVolume_4x_pooled_s2.yaml
#
# stage2 init vs resume are DECOUPLED (mirrors MAISI train_VAE.py Design B):
#   - init_weights_from : the converged stage1 ckpt. Used ONCE on the first
#     launch — torch.load -> load_state_dict (decoder+disc fine-tune, encoder
#     frozen by AE_finetuning), fresh optimizer + global_step=0.
#   - resume_from_checkpoint : stage2's OWN ckpt. Used on SLURM requeue — passed
#     as PL `ckpt_path` for a FULL resume (restores global_step/optimizer/epoch).
#     Leave empty here; train_3d_meddiff.sh auto-injects the highest-step stage2
#     ckpt on requeue. resume takes priority over init when both are set.
# NOTE: DIFFERENT entry point than stage1 (train_PatchVolume_stage2.py) — the
# launcher selects it for STAGE=stage2.
#
# COMPUTE / FAIRNESS = (B) converged-best (2026-06-06 decision): train to its
# own convergence plateau, GPU-hour floor >= MAISI total, report GPU-hours +
# convergence curves for BOTH the equal-budget point and the plateau. max_steps
# is a published-ceiling cap (upstream 1,000,000), NOT a compute-match constant;
# 3DMD has no LR schedule (constant Adam 3e-4) so the cap doesn't distort lr.
# Operative stop = rFID plateau; affordable ceiling finalized after the stage1
# throughput sanity (it/s -> GPU-hours).

model:
  seed: 1234
  batch_size: 1
  num_workers: 8

  gpus: 8
  default_root_dir: /data/wonyoungjang/decodata/3d_meddiff/pooled_s2
  resume_from_checkpoint:        # stage2's OWN ckpt (requeue); empty on first launch — launcher auto-injects
  # converged stage1 = global_step 82,416 (rFID-best, 2026-06-16 sweep). This is
  # a rolling val-best slot (latest_checkpoint.ckpt) — pin a copy if stage1 ever reruns.
  # step 100,000, the val-best of the corrected sweep (2026-09-09,
  # results_pooled_3dmd_trajectory.csv). FID_inc 4.681 and LPIPS 0.0243 both peak
  # here and PSNR is within 0.02 dB of its own best at 80k, so all three agree on
  # one point -- unlike the previous sweep, where 82k/94k/102k were indistinguishable.
  # NOT latest_checkpoint.ckpt, which this line used to point at: that is a rolling
  # val-best slot (overwritten if stage1 ever reruns) holding step 82,416, and it was
  # selected on RadImageNet at center_slices_ratio 1.0 -- a combination we do not
  # quote, and a different ruler from the Inception r=0.4 our own arms were chosen on.
  init_weights_from: /data/wonyoungjang/decodata/3d_meddiff/pooled/my_model/version_0/checkpoints/epoch=245-step=100000-10000-train/recon_loss=0.13.ckpt
  # 40,000, matching our own DFT budget, NOT upstream's 1,000,000. 3DMD's "stage2"
  # is a DECODER fine-tune with the encoder frozen (AE_finetuning freezes encoder,
  # pre_vq_conv and codebook -- PatchVolume.py:702), so it is the analog of our
  # train_DFT.py, not of our stage1->stage2 patch curriculum. Plan section 2 fixed
  # the rule: match Phase 2 to our DFT rather than to upstream.
  max_steps: 40000
  max_epochs: 10000
  precision: bf16

  perceptual_3d: False
  embedding_dim: 8
  n_codes: 8192
  n_hiddens: 48
  lr: 3e-4
  downsample: [4, 4, 4]
  disc_channels: 32
  disc_layers: 3
  discriminator_iter_start: 0
  disc_loss_type: hinge
  volume_gan_weight: 2
  l1_weight: 4.0
  gan_feat_weight: 4
  perceptual_weight: 2
  i3d_feat: False
  restart_thres: 1.0
  no_random_restart: False
  norm_type: group
  num_groups: 24
  stage: 2

dataset:
  root_dir: /data/wonyoungjang/decovae/configs/3d_meddiff/data_pooled.json
  image_channels: 1
  imgtype: MR
  patch_size: 64
