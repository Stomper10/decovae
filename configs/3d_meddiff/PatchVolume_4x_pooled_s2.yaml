# 3D-MedDiffusion PatchVolume AE — POOLED stage2 (VOLUME phase).
#
# 3D-MedDiff's OWN two-phase AE recipe: stage1 trains on 64^3 patches
# (PatchVolume_4x_pooled.yaml), stage2 fine-tunes on whole volumes with the
# discriminator on from step 0. This mirrors the upstream config/PatchVolume_4x_s2.yaml
# verbatim except paths + max_steps. Run with the STAGE2 entry point:
#
#   conda activate 3d_meddiff
#   python external/3d_meddiff/train/train_PatchVolume_stage2.py \
#     --config configs/3d_meddiff/PatchVolume_4x_pooled_s2.yaml
#
# stage2 inits ALL weights from the converged stage1 checkpoint via
# `resume_from_checkpoint` (torch.load -> load_state_dict; decoder+disc train,
# encoder frozen). Set resume_from_checkpoint to the chosen stage1 ckpt below
# (or let train_3d_meddiff.sh inject it). NOTE: this is a DIFFERENT entry point
# than stage1 (train_PatchVolume_stage2.py) — the launcher must select it for
# STAGE=stage2.
#
# COMPUTE / FAIRNESS = (B) converged-best (2026-06-06 decision): train to its
# own convergence plateau, GPU-hour floor >= MAISI total, report GPU-hours +
# convergence curves for BOTH the equal-budget point and the plateau. max_steps
# is a published-ceiling cap (upstream 1,000,000), NOT a compute-match constant;
# 3DMD has no LR schedule (constant Adam 3e-4) so the cap doesn't distort lr.
# Operative stop = rFID plateau; affordable ceiling finalized after the stage1
# throughput sanity (it/s -> GPU-hours).

model:
  seed: 1234
  batch_size: 1
  num_workers: 8

  gpus: 8
  default_root_dir: /data/wonyoungjang/decodata/3d_meddiff/pooled_s2
  resume_from_checkpoint:        # <- converged pooled stage1 ckpt (.ckpt)
  max_steps: 1000000
  max_epochs: 10000
  precision: bf16

  perceptual_3d: False
  embedding_dim: 8
  n_codes: 8192
  n_hiddens: 48
  lr: 3e-4
  downsample: [4, 4, 4]
  disc_channels: 32
  disc_layers: 3
  discriminator_iter_start: 0
  disc_loss_type: hinge
  volume_gan_weight: 2
  l1_weight: 4.0
  gan_feat_weight: 4
  perceptual_weight: 2
  i3d_feat: False
  restart_thres: 1.0
  no_random_restart: False
  norm_type: group
  num_groups: 24
  stage: 2

dataset:
  root_dir: /data/wonyoungjang/decovae/configs/3d_meddiff/data_pooled.json
  image_channels: 1
  imgtype: MR
  patch_size: 64
