# SMOKE-TEST clone of PatchVolume_4x_pooled_s2.yaml — gpu-4farm validation only.
# Purpose: verify the stage2 plumbing (init_weights_from load_state_dict from the
# converged stage1 ckpt, whole-volume 192^3 bs1 memory via sanity-val + a few
# train steps, W&B logging, DDP) BEFORE the real 8-GPU stage2 run. NOT a real run:
#   - gpus 4 (4farm), max_steps 30 (no checkpoint/no plateau), separate root dir.
# Delete the pooled_s2_smoke dir + its W&B run (3dmd-pooled_s2_smoke) afterward.
# Launch:
#   EXP_NAME=pooled_s2_smoke STAGE=stage2 \
#     CONFIG=configs/3d_meddiff/PatchVolume_4x_pooled_s2_smoke.yaml \
#     sbatch -p gpu-4farm --gres=gpu:h100:4 --ntasks-per-node=4 --cpus-per-task=14 \
#     train_3d_meddiff.sh

model:
  seed: 1234
  batch_size: 1
  num_workers: 8

  gpus: 4
  default_root_dir: /data/wonyoungjang/decodata/3d_meddiff/pooled_s2_smoke
  resume_from_checkpoint:        # empty -> exercises the init_weights_from path
  init_weights_from: /data/wonyoungjang/decodata/3d_meddiff/pooled/my_model/version_0/checkpoints/latest_checkpoint.ckpt
  max_steps: 30
  max_epochs: 10000
  precision: bf16

  perceptual_3d: False
  embedding_dim: 8
  n_codes: 8192
  n_hiddens: 48
  lr: 3e-4
  downsample: [4, 4, 4]
  disc_channels: 32
  disc_layers: 3
  discriminator_iter_start: 0
  disc_loss_type: hinge
  volume_gan_weight: 2
  l1_weight: 4.0
  gan_feat_weight: 4
  perceptual_weight: 2
  i3d_feat: False
  restart_thres: 1.0
  no_random_restart: False
  norm_type: group
  num_groups: 24
  stage: 2

dataset:
  root_dir: /data/wonyoungjang/decovae/configs/3d_meddiff/data_pooled.json
  image_channels: 1
  imgtype: MR
  patch_size: 64
