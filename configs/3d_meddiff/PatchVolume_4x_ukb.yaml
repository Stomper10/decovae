# 3D-MedDiffusion PatchVolume AE — UKB c=4 baseline for DecoVAE journal extension.
#
# Run from repo root with the 3d_meddiff conda env:
#   conda activate 3d_meddiff
#   python external/3d_meddiff/train/train_PatchVolume.py \
#     --config configs/3d_meddiff/PatchVolume_4x_ukb.yaml
#
# Only the values that differ from the upstream default are tweaked:
#   - default_root_dir  : DecoVAE-managed output path
#   - root_dir          : data.json from scripts/build_3d_meddiff_data_json.py
#   - imgtype           : MR (upstream default is CT)
#   - max_steps         : 300000 (compute-matched to MAISI/DeCo-VAE stage1+stage2
#                                 total = 100k + 200k = 300k. Upstream default is
#                                 1,000,000; we restrict for compute-matched
#                                 comparison. Convergence-validate at 300k via
#                                 evaluation/convergence_plot.py — if slope
#                                 > 0.5%/10ep, extend to 400k cap.)

model:
  seed: 1234
  batch_size: 16
  num_workers: 8

  gpus: 8
  default_root_dir: /data/wonyoungjang/decodata/3d_meddiff/ukb_c4
  resume_from_checkpoint:
  max_steps: 300000
  max_epochs: 10000
  precision: bf16

  perceptual_3d: False
  embedding_dim: 8
  n_codes: 8192
  n_hiddens: 48
  lr: 3e-4
  downsample: [4, 4, 4]
  disc_channels: 32
  disc_layers: 3
  discriminator_iter_start: 12000
  disc_loss_type: hinge
  volume_gan_weight: 2
  l1_weight: 4.0
  gan_feat_weight: 4
  perceptual_weight: 2
  i3d_feat: False
  restart_thres: 1.0
  no_random_restart: False
  norm_type: group
  num_groups: 24
  stage: 1

dataset:
  root_dir: /data/wonyoungjang/decovae/configs/3d_meddiff/data_ukb.json
  image_channels: 1
  imgtype: MR
  patch_size: 64
