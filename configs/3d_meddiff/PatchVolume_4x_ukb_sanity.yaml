# Sanity-only override of PatchVolume_4x_ukb.yaml: single GPU, 100 steps.
# Used to confirm forward/backward/dataloader/checkpoint paths before
# committing an 8-GPU full run.

model:
  seed: 1234
  batch_size: 16
  num_workers: 8

  gpus: 4
  default_root_dir: /data/wonyoungjang/decodata/3d_meddiff/ukb_c4_sanity
  resume_from_checkpoint:
  max_steps: 100
  max_epochs: 10000
  precision: bf16

  perceptual_3d: False
  embedding_dim: 8
  n_codes: 8192
  n_hiddens: 48
  lr: 3e-4
  downsample: [4, 4, 4]
  disc_channels: 32
  disc_layers: 3
  discriminator_iter_start: 12000
  disc_loss_type: hinge
  volume_gan_weight: 2
  l1_weight: 4.0
  gan_feat_weight: 4
  perceptual_weight: 2
  i3d_feat: False
  restart_thres: 1.0
  no_random_restart: False
  norm_type: group
  num_groups: 24
  stage: 1

dataset:
  root_dir: /data/wonyoungjang/decovae/configs/3d_meddiff/data_ukb.json
  image_channels: 1
  imgtype: MR
  patch_size: 64
